services:
  restreamer:
    image: ghcr.io/kaibsora/restreamer:sha-c545e64
    container_name: restreamer
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8181:8181"
      - "1935:1935"
      - "1936:1936"
      - "6000:6000/udp"
    volumes:
      - restreamer-config:/core/config
      - restreamer-data:/core/data
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-109}"
      - "${VIDEO_GID:-44}"
    environment:
      RESTREAMER_VAAPI_DEVICE: "${RESTREAMER_VAAPI_DEVICE:-}"
      RESTREAMER_QSV_DEVICE: "${RESTREAMER_QSV_DEVICE:-}"
      RESTREAMER_VULKAN_DEVICE: "${RESTREAMER_VULKAN_DEVICE:-0}"

  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    container_name: restreamer-mediamtx
    restart: unless-stopped
    command: /mediamtx.yml
    environment:
      # Set RESTREAMER_WEBRTC_HOSTS to a comma-separated LAN IP / DNS list when
      # clients cannot reach the address discovered inside the container.
      MTX_WEBRTCADDITIONALHOSTS: "${RESTREAMER_WEBRTC_HOSTS:-}"
    ports:
      - "8554:8554/tcp"
      - "8000:8000/udp"
      - "8001:8001/udp"
      - "8889:8889/tcp"
      - "8189:8189/udp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    security_opt:
      - no-new-privileges:true

volumes:
  restreamer-config:
  restreamer-data:
