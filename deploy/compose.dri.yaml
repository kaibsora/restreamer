services:
  restreamer:
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-109}"
      - "${VIDEO_GID:-44}"
    environment:
      RESTREAMER_VAAPI_DEVICE: "${RESTREAMER_VAAPI_DEVICE:-}"
      RESTREAMER_QSV_DEVICE: "${RESTREAMER_QSV_DEVICE:-}"
      RESTREAMER_VULKAN_DEVICE: "${RESTREAMER_VULKAN_DEVICE:-0}"
