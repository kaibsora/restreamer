name: Build unified Restreamer

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: "FFmpeg source: master, stable, exact release, or git-SHA (blank selects master)"
        required: false
        type: string
  schedule:
    - cron: "23 6 * * *"
  push:
    branches:
      - 2.x
      - main
    paths:
      - "components/**"
      - "scripts/**"
      - "ui-root/**"
      - "Dockerfile"
      - ".dockerignore"
      - "run.sh"
      - "deploy/**"
      - ".github/workflows/build-unified.yml"
  pull_request:
    paths:
      - "components/**"
      - "scripts/**"
      - "ui-root/**"
      - "deploy/**"
      - "Dockerfile"
      - ".dockerignore"
      - "run.sh"
      - ".github/workflows/build-unified.yml"

permissions:
  contents: read

concurrency:
  group: unified-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Keep the immutable FFmpeg build stages in the same GHCR package as the
  # unified image. This repository already owns that package's Actions access,
  # avoiding a second package-level permission grant for an internal stage.
  FFMPEG_IMAGE_NAME: ${{ github.repository }}
  FFMPEG_TAG_PREFIX: ffmpeg-hardware
  MAX_UNIFIED_IMAGE_BYTES: 1500000000

jobs:
  quality:
    name: quality / ${{ matrix.suite }}
    # Never execute untrusted fork code on a self-hosted runner. Same-repository
    # pull requests remain eligible because their authors already have push access.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      # Use the three-runner ARC pool while retaining results from every suite
      # when one fails. The aggregate matrix result still gates version/build.
      fail-fast: false
      max-parallel: 3
      matrix:
        suite:
          - ui
          - core
          - configuration
    runs-on: ${{ fromJSON(vars.RESTREAMER_RUNNER_LABELS || '["restreamer-linux"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate self-hosted runner
        run: scripts/verify-self-hosted-runner.sh

      - name: Validate shell scripts
        if: matrix.suite == 'configuration'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "${script}"
          done < <(git ls-files -z '*.sh')
          scripts/test-hardware-report.sh
          scripts/test-accept-relays.sh
          scripts/test-resolve-ffmpeg-version.sh

      - name: Test and build UI
        if: matrix.suite == 'ui'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${PWD}/components/ui:/src:ro" \
            node:24-alpine3.22 \
            sh -lc 'cp -R /src /tmp/ui && cd /tmp/ui && corepack enable && corepack prepare yarn@1.22.22 --activate >/dev/null && yarn install --frozen-lockfile && yarn audit-production && yarn test-ci && yarn build'

      - name: Test and vet Core
        if: matrix.suite == 'core'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${PWD}/components/core:/src:ro" \
            golang:1.26-alpine3.23 \
            sh -c 'cp -R /src /tmp/core && cd /tmp/core && apk add --no-cache bash git >/dev/null && go test ./... && go vet ./... && ./scripts/check-vulnerabilities.sh'

      - name: Validate Compose configuration
        if: matrix.suite == 'configuration'
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --env-file deploy/.env.example \
            --file deploy/compose.yaml \
            --file deploy/compose.dri.yaml \
            --file deploy/compose.nvidia.yaml \
            --file deploy/compose.camera-example.yaml \
            --file deploy/compose.smoke.yaml \
            config >/dev/null

      - name: Validate MediaMTX configuration
        if: matrix.suite == 'configuration'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${PWD}/deploy/mediamtx.yml:/mediamtx.yml:ro" \
            bluenviron/mediamtx:1.21.3 \
            --validate-conf=/mediamtx.yml

  version:
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.RESTREAMER_RUNNER_LABELS || '["restreamer-linux"]') }}
    outputs:
      ffmpeg: ${{ steps.resolve.outputs.ffmpeg }}
      published: ${{ steps.registry.outputs.published }}
      digest: ${{ steps.registry.outputs.digest }}
      rebuild: ${{ steps.plan.outputs.rebuild }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The build plan compares the complete pushed range so a multi-commit
          # push cannot hide an FFmpeg source change outside a shallow clone.
          fetch-depth: 0

      - name: Validate self-hosted runner
        run: scripts/verify-self-hosted-runner.sh

      - name: Resolve FFmpeg source
        id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.ffmpeg_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(scripts/resolve-ffmpeg-version.sh "${REQUESTED_VERSION}")"
          echo "ffmpeg=${version}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR for source lookup
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this FFmpeg source is already published
        id: registry
        env:
          FFMPEG_VERSION: ${{ steps.resolve.outputs.ffmpeg }}
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${FFMPEG_IMAGE_NAME}:${FFMPEG_TAG_PREFIX}-${FFMPEG_VERSION}"
          if docker manifest inspect "${image}" >/dev/null 2>&1; then
            digest="$(docker buildx imagetools inspect \
              "${image}" --format '{{.Manifest.Digest}}')"
            if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Unable to resolve a valid digest for ${image}: ${digest}" >&2
              exit 1
            fi
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
            echo "${image} already exists; a scheduled run has nothing new to publish."
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
            echo "digest=" >> "${GITHUB_OUTPUT}"
            echo "${image} is not published yet."
          fi

      - name: Decide whether FFmpeg must be rebuilt
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISHED: ${{ steps.registry.outputs.published }}
        shell: bash
        run: |
          set -euo pipefail
          rebuild=false
          reason="published FFmpeg image is reusable"

          case "${EVENT_NAME}" in
            workflow_dispatch)
              rebuild=true
              reason="manual workflow request"
              ;;
            schedule)
              if [[ "${PUBLISHED}" != true ]]; then
                rebuild=true
                reason="new upstream FFmpeg source"
              fi
              ;;
            push)
              if [[ "${PUBLISHED}" != true ]]; then
                rebuild=true
                reason="FFmpeg image is not published"
              elif [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" =~ ^0+$ ]]; then
                rebuild=true
                reason="push has no comparable base revision"
              elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                rebuild=true
                reason="push base revision is unavailable"
              elif ! git diff --quiet "${BEFORE_SHA}" "${GITHUB_SHA}" -- \
                components/ffmpeg \
                scripts/resolve-ffmpeg-version.sh; then
                rebuild=true
                reason="FFmpeg build inputs changed"
              fi
              ;;
            *)
              rebuild=true
              reason="unrecognized event requires a conservative rebuild"
              ;;
          esac

          echo "rebuild=${rebuild}" >> "${GITHUB_OUTPUT}"
          echo "FFmpeg rebuild: ${rebuild} (${reason})."

  ffmpeg:
    if: needs.version.outputs.rebuild == 'true'
    needs:
      - quality
      - version
    runs-on: ${{ fromJSON(vars.RESTREAMER_RUNNER_LABELS || '["restreamer-linux"]') }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate self-hosted runner
        run: scripts/verify-self-hosted-runner.sh

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build hardware FFmpeg
        id: build
        uses: docker/build-push-action@v7
        with:
          context: components/ffmpeg
          file: components/ffmpeg/Dockerfile.ubuntu.hardware
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_DATE=${{ github.run_id }}
            BUILD_COMMIT=${{ github.sha }}
            FFMPEG_VERSION=${{ needs.version.outputs.ffmpeg }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FFMPEG_IMAGE_NAME }}:${{ env.FFMPEG_TAG_PREFIX }}-${{ needs.version.outputs.ffmpeg }}
            ${{ env.REGISTRY }}/${{ env.FFMPEG_IMAGE_NAME }}:${{ env.FFMPEG_TAG_PREFIX }}-latest
          cache-from: type=gha,scope=ffmpeg-hardware
          cache-to: type=gha,mode=max,scope=ffmpeg-hardware
          provenance: mode=max
          sbom: true

  restreamer:
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      needs.version.result == 'success' &&
      (needs.ffmpeg.result == 'success' || needs.ffmpeg.result == 'skipped') &&
      (github.event_name != 'schedule' || needs.version.outputs.published != 'true')
    needs:
      - quality
      - version
      - ffmpeg
    runs-on: ${{ fromJSON(vars.RESTREAMER_RUNNER_LABELS || '["restreamer-linux"]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Validate self-hosted runner
        run: scripts/verify-self-hosted-runner.sh

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=ffmpeg-${{ needs.version.outputs.ffmpeg }}
            type=sha
          labels: |
            org.opencontainers.image.version=${{ github.sha }}
            io.restreamer.repository.branch=${{ github.ref_name }}

      - name: Generate build identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid Git commit supplied by Actions: ${GITHUB_SHA}" >&2
            exit 1
          fi
          build_date="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "build_date=${build_date}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build unified image for validation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            FFMPEG_IMAGE=${{ env.REGISTRY }}/${{ env.FFMPEG_IMAGE_NAME }}@${{ needs.ffmpeg.outputs.digest || needs.version.outputs.digest }}
            RUN_TESTS=false
            RESTREAMER_COMMIT=${{ steps.identity.outputs.commit }}
            RESTREAMER_BRANCH=${{ steps.identity.outputs.branch }}
            RESTREAMER_BUILD_DATE=${{ steps.identity.outputs.build_date }}
          tags: restreamer-smoke:local
          cache-from: type=gha,scope=restreamer-unified
          cache-to: type=gha,mode=max,scope=restreamer-unified

      - name: Enforce unified image size budget
        shell: bash
        run: |
          set -euo pipefail
          image_size="$(docker image inspect \
            restreamer-smoke:local --format '{{.Size}}')"
          if ! [[ "${image_size}" =~ ^[0-9]+$ ]]; then
            echo "Docker returned an invalid image size: ${image_size}" >&2
            exit 1
          fi
          if (( image_size > MAX_UNIFIED_IMAGE_BYTES )); then
            echo "Unified image is ${image_size} bytes; budget is ${MAX_UNIFIED_IMAGE_BYTES}." >&2
            exit 1
          fi
          echo "Unified image is ${image_size} bytes (budget: ${MAX_UNIFIED_IMAGE_BYTES})."

      - name: Smoke test unified camera stack
        shell: bash
        env:
          RESTREAMER_IMAGE: restreamer-smoke:local
          SMOKE_EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
          SMOKE_EXPECTED_BRANCH: ${{ steps.identity.outputs.branch }}
          SMOKE_EXPECTED_BUILD_DATE: ${{ steps.identity.outputs.build_date }}
        run: |
          scripts/smoke-compose.sh

      - name: Publish unified image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FFMPEG_IMAGE=${{ env.REGISTRY }}/${{ env.FFMPEG_IMAGE_NAME }}@${{ needs.ffmpeg.outputs.digest || needs.version.outputs.digest }}
            RUN_TESTS=false
            RESTREAMER_COMMIT=${{ steps.identity.outputs.commit }}
            RESTREAMER_BRANCH=${{ steps.identity.outputs.branch }}
            RESTREAMER_BUILD_DATE=${{ steps.identity.outputs.build_date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=restreamer-unified
          cache-to: type=gha,mode=max,scope=restreamer-unified
          provenance: mode=max
          sbom: true

      - name: Verify published image by digest
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
          EXPECTED_BRANCH: ${{ steps.identity.outputs.branch }}
          PUBLISHED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "${PUBLISHED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Published image returned an invalid digest: ${PUBLISHED_DIGEST}" >&2
            exit 1
          fi

          image="${REGISTRY}/${IMAGE_NAME}@${PUBLISHED_DIGEST}"
          docker pull "${image}"

          revision="$(docker image inspect "${image}" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          version="$(docker image inspect "${image}" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          branch="$(docker image inspect "${image}" \
            --format '{{index .Config.Labels "io.restreamer.repository.branch"}}')"

          [[ "${revision}" == "${EXPECTED_COMMIT}" ]]
          [[ "${version}" == "${EXPECTED_COMMIT}" ]]
          [[ "${branch}" == "${EXPECTED_BRANCH}" ]]

          docker run --rm \
            --entrypoint /usr/local/bin/restreamer-verify-ffmpeg \
            "${image}"
          echo "Verified published image ${image}."
