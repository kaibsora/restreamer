name: Build unified CQComber Restreamer

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: "FFmpeg source: master, stable, exact release, or git-SHA (blank selects master)"
        required: false
        type: string
      rebuild_ffmpeg:
        description: "Rebuild FFmpeg even when the matching source and build inputs are already published"
        required: false
        default: false
        type: boolean
      publish_latest:
        description: "Deprecated: must be false; use Promote accepted release to update latest"
        required: false
        default: false
        type: boolean
      expected_commit:
        description: "Optional exact application commit; abort if GitHub dispatches a different snapshot"
        required: false
        type: string
  schedule:
    - cron: "23 6 * * *"
  push:
    branches:
      - main
      - development
    paths:
      - "components/**"
      - "scripts/**"
      - "ui-root/**"
      - "Dockerfile"
      - "LICENSE"
      - "NOTICE"
      - "THIRD_PARTY.md"
      - "MODIFICATIONS.md"
      - ".dockerignore"
      - "run.sh"
      - "deploy/**"
      - ".github/workflows/build-*.yml"
  pull_request:
    paths:
      - "components/**"
      - "scripts/**"
      - "ui-root/**"
      - "deploy/**"
      - "Dockerfile"
      - ".dockerignore"
      - "run.sh"
      - ".github/workflows/build-*.yml"

permissions:
  contents: read

concurrency:
  # Separate the native matrix from the legacy single-platform pipeline queue.
  group: unified-native-${{ github.ref }}
  # Nightly checks wait for active work; they must not cancel a release push.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Keep the immutable FFmpeg build stages in the same GHCR package as the
  # unified image. This repository already owns that package's Actions access,
  # avoiding a second package-level permission grant for an internal stage.
  FFMPEG_IMAGE_NAME: ${{ github.repository }}
  FFMPEG_TAG_PREFIX: ffmpeg-hardware
  MAX_UNIFIED_IMAGE_BYTES: 1500000000

jobs:
  quality:
    name: quality / ${{ matrix.suite }}
    # Never execute untrusted fork code on a self-hosted runner. Same-repository
    # pull requests remain eligible because their authors already have push access.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      # Use the three-runner ARC pool while retaining results from every suite
      # when one fails. The aggregate matrix result still gates version/build.
      fail-fast: false
      max-parallel: 3
      matrix:
        suite:
          - ui
          - core
          - configuration
    runs-on: ${{ fromJSON(vars.RESTREAMER_RUNNER_LABELS || '["restreamer-linux"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify requested application commit
        if: github.event_name == 'workflow_dispatch' && inputs.expected_commit != ''
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "${GITHUB_SHA}" = "${EXPECTED_COMMIT}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT}"

      - name: Validate self-hosted runner
        run: scripts/verify-self-hosted-runner.sh

      - name: Validate shell scripts
        if: matrix.suite == 'configuration'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "${script}"
          done < <(git ls-files -z '*.sh')
          scripts/test-hardware-report.sh
          scripts/test-accept-hls-viewers.sh
          scripts/test-accept-relays.sh
          scripts/test-resolve-ffmpeg-version.sh
          bash scripts/test-ffmpeg-build-inputs.sh
          bash scripts/test-promote-release.sh
          docker run --rm -v "${PWD}/scripts:/scripts:ro" node:24-alpine3.22 node --test /scripts/validate-image-index.test.cjs

      - name: Test and build UI
        if: matrix.suite == 'ui'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${PWD}/components/ui:/src:ro" \
            node:24-alpine3.22 \
            sh -lc 'cp -R /src /tmp/ui && cd /tmp/ui && corepack enable && corepack prepare yarn@1.22.22 --activate >/dev/null && yarn install --frozen-lockfile && yarn audit-production && yarn test-ci && yarn build'

      - name: Test and vet Core
        if: matrix.suite == 'core'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${PWD}/components/core:/src:ro" \
            golang:1.26-alpine3.23 \
            sh -c 'cp -R /src /tmp/core && cd /tmp/core && apk add --no-cache bash git >/dev/null && go test ./... && go vet ./... && ./scripts/check-vulnerabilities.sh'

      - name: Validate Compose configuration
        if: matrix.suite == 'configuration'
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --env-file deploy/.env.example \
            --file deploy/compose.yaml \
            --file deploy/compose.nvidia.yaml \
            --file deploy/compose.camera-example.yaml \
            --file deploy/compose.smoke.yaml \
            config >/dev/null
          docker compose --file deploy/compose.yaml --file deploy/compose.hotplug.yaml config >/dev/null
          docker compose --file deploy/compose.yaml --file deploy/compose.cpu.yaml config >/dev/null
          docker compose --file deploy/compose.yaml --file deploy/compose.raspberrypi.yaml config >/dev/null
          docker compose --file deploy/compose.yaml --file deploy/compose.cpu.yaml --file deploy/compose.nvidia.yaml --file deploy/compose.hotplug.yaml config >/dev/null

      - name: Validate MediaMTX configuration
        if: matrix.suite == 'configuration'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${PWD}/deploy/mediamtx.yml:/mediamtx.yml:ro" \
            bluenviron/mediamtx:1.21.3 \
            --validate-conf=/mediamtx.yml

  version:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ${{ fromJSON(vars.RESTREAMER_RUNNER_LABELS || '["restreamer-linux"]') }}
    outputs:
      ffmpeg: ${{ steps.resolve.outputs.ffmpeg }}
      build_inputs: ${{ steps.resolve.outputs.build_inputs }}
    steps:
      - uses: actions/checkout@v7
      - name: Require separate release promotion
        env:
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: test "${PUBLISH_LATEST}" != true
      - name: Resolve shared FFmpeg source
        id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.ffmpeg_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "ffmpeg=$(scripts/resolve-ffmpeg-version.sh "${REQUESTED_VERSION}")" >> "${GITHUB_OUTPUT}"
          echo "build_inputs=$(bash scripts/ffmpeg-build-inputs.sh)" >> "${GITHUB_OUTPUT}"

  platforms:
    needs: [quality, version]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    uses: ./.github/workflows/build-platform.yml
    permissions:
      contents: read
      packages: write
    with:
      arch: ${{ matrix.arch }}
      runner_labels: ${{ matrix.arch == 'arm64' && (vars.RESTREAMER_ARM64_RUNNER_LABELS || '["linux","arm64","docker"]') || (vars.RESTREAMER_RUNNER_LABELS || '["restreamer-linux"]') }}
      ffmpeg_version: ${{ needs.version.outputs.ffmpeg }}
      build_inputs: ${{ needs.version.outputs.build_inputs }}
      rebuild_ffmpeg: ${{ inputs.rebuild_ffmpeg == true }}

  merge:
    needs: platforms
    runs-on: ${{ fromJSON(vars.RESTREAMER_RUNNER_LABELS || '["restreamer-linux"]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: platform-*
          path: platform-records
          merge-multiple: true
      - name: Assemble and validate candidate index
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            test -s "platform-records/${arch}.digest"
            grep -Ex 'sha256:[0-9a-f]{64}' "platform-records/${arch}.digest"
          done
          tag="${IMAGE}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create -t "${tag}" \
            "${IMAGE}@$(cat platform-records/amd64.digest)" \
            "${IMAGE}@$(cat platform-records/arm64.digest)"
          docker buildx imagetools inspect --raw "${tag}" | \
            docker run --rm -i -v "${PWD}/scripts:/scripts:ro" node:24-alpine3.22 node /scripts/validate-image-index.cjs
          digest="$(docker buildx imagetools inspect "${tag}" --format '{{.Manifest.Digest}}')"
          echo "Candidate: ${tag}@${digest}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Both native platforms passed; latest is unchanged until release promotion." >> "${GITHUB_STEP_SUMMARY}"
          # Keep the default Dockerfile base multi-platform on the stable branch.
          if [[ "${GITHUB_REF_NAME}" == main ]]; then
            for arch in amd64 arm64; do
              grep -Ex 'sha256:[0-9a-f]{64}' "platform-records/${arch}.runtime"
            done
            docker buildx imagetools create -t "${IMAGE}:ffmpeg-hardware-latest" \
              "${IMAGE}@$(cat platform-records/amd64.runtime)" \
              "${IMAGE}@$(cat platform-records/arm64.runtime)"
            docker buildx imagetools inspect --raw "${IMAGE}:ffmpeg-hardware-latest" | \
              docker run --rm -i -v "${PWD}/scripts:/scripts:ro" node:24-alpine3.22 node /scripts/validate-image-index.cjs
          fi
