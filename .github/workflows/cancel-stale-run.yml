name: Cancel stale ARC run

on:
  push:
    branches:
      - 2.x
    paths:
      - ".github/workflows/cancel-stale-run.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    # Emergency control-plane job only. Image builds remain on restreamer-linux.
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel stale workflow run
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: 42148004171,
            });
